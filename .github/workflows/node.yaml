name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        # Must match the runtime field in companion/manifest.json.
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Prepare environment
        run: corepack enable
      - name: Install
        run: yarn install
        env:
          CI: true
      - name: Build and check types
        run: yarn build
        env:
          CI: true
      - name: Lint
        run: yarn lint
        env:
          CI: true
      - name: Format check
        run: yarn format:check
        env:
          CI: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Prepare environment
        run: corepack enable
      - name: Install
        run: yarn install
        env:
          CI: true
      - name: Run tests
        run: yarn test
        env:
          CI: true
